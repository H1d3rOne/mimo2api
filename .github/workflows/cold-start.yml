name: Cold start Claw instance

# 冷启动兜底：打破 "全部实例离线 → tunnel 断 → Worker 拉不起新实例" 的死结。
# GitHub runner 出口（Azure）不受 Cloudflare destination_ip_prohibited 限制，能直连 aistudio。
#
# 两段式判断（兼顾风控：平时尽量不让 GitHub 碰 aistudio）：
#   1) 先问 Worker /api/cold-start：
#      - action=none  → Worker 通过自己的通道查到至少一个实例 AVAILABLE，GitHub 直接退出，不碰 aistudio。
#      - action=verify → Worker 没查到任何 AVAILABLE（全不可用，或通道断查不到），随响应附带【全部】凭据。
#   2) action=verify 时，GitHub 用每个凭据直连 aistudio 独立复查状态：
#      - 只要有任意一个 AVAILABLE → 说明实例其实还在（tunnel 残留导致 Worker 误判/查不到），不 create，退出。
#      - 全部非 AVAILABLE → 挑一个 create，拉起 1 个即可打破死结，Worker Cron 随后接管。
#
# 凭据不写入 GitHub Secrets：仅在 action=verify 时由 Worker 现取并随响应返回。
#
# 需要的仓库 Secrets：
#   WORKER_BASE_URL    例如 https://mimo.rushai.us.ci
#   COLDSTART_KEY      与 Worker 的 MIMO_COLDSTART_KEY 相同的共享密钥

on:
  schedule:
    - cron: "*/13 * * * *"   # 每约13分钟（GitHub cron 常有延迟，间隔取小以留冗余）
  workflow_dispatch:

concurrency:
  group: cold-start
  cancel-in-progress: false

jobs:
  cold-start:
    runs-on: ubuntu-latest
    steps:
      - name: Check & cold-start
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          COLDSTART_KEY: ${{ secrets.COLDSTART_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${WORKER_BASE_URL:-}" ] || [ -z "${COLDSTART_KEY:-}" ]; then
            echo "::error::缺少 WORKER_BASE_URL 或 COLDSTART_KEY secret"
            exit 1
          fi

          AISTUDIO="https://aistudio.xiaomimimo.com"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

          # 值含空格或 = 时加引号，与 Worker 端 cookieString 保持一致。
          quote_val() {
            case "$1" in
              *" "*|*"="*) printf '"%s"' "$1" ;;
              *) printf '%s' "$1" ;;
            esac
          }

          # 用一组凭据查 aistudio 实例状态，输出状态字符串（AVAILABLE / 其它 / 空=查询失败）。
          # 不打印 cookie。stdout 仅返回 status，调试信息走 stderr。
          query_status() {
            local uid="$1" stoken="$2" ph="$3"
            local cookie ph_enc body code
            cookie="serviceToken=$(quote_val "$stoken"); userId=$(quote_val "$uid"); xiaomichatbot_ph=$(quote_val "$ph")"
            ph_enc="$(jq -rn --arg v "$ph" '$v|@uri')"
            body="$(curl -s -w "\nHTTP:%{http_code}" --max-time 20 \
              -H "Accept: */*" \
              -H "Origin: ${AISTUDIO}" \
              -H "Referer: ${AISTUDIO}/" \
              -H "x-timezone: Asia/Shanghai" \
              -H "User-Agent: ${UA}" \
              -H "Cookie: ${cookie}" \
              "${AISTUDIO}/open-apis/user/mimo-claw/status?xiaomichatbot_ph=${ph_enc}" || true)"
            code="$(printf '%s' "$body" | sed -n 's/^HTTP://p' | tail -1)"
            local json status
            json="$(printf '%s' "$body" | sed '$d')"
            status="$(printf '%s' "$json" | jq -r '.data.status // empty' 2>/dev/null || true)"
            echo "  [status] userId=${uid} HTTP:${code} status=${status:-<none>}" >&2
            printf '%s' "$status"
          }

          echo "=== 1. 向 Worker 查询冷启动决策 ==="
          # 响应体可能含全部凭据，绝不打印 RESP。
          RESP="$(curl -s --max-time 25 \
            -H "Authorization: Bearer ${COLDSTART_KEY}" \
            "${WORKER_BASE_URL%/}/api/cold-start")"

          ACTION="$(printf '%s' "$RESP" | jq -r '.action // empty')"
          echo "Worker 决策: action=${ACTION:-<none>}, workerAvailable=$(printf '%s' "$RESP" | jq -r '.availableInstances // "?"')"

          if [ "$ACTION" = "none" ]; then
            echo "Worker 已确认有在线实例，无需冷启动，GitHub 不访问 aistudio。"
            exit 0
          fi

          if [ "$ACTION" != "verify" ]; then
            echo "::warning::Worker 返回非预期 action（${ACTION:-空}）：$(printf '%s' "$RESP" | jq -r '.error // "unknown"')"
            exit 0
          fi

          # action=verify：Worker 没查到任何 AVAILABLE，附带全部凭据，GitHub 独立复查。
          CRED_COUNT="$(printf '%s' "$RESP" | jq -r '.credentials | length' 2>/dev/null || echo 0)"
          if [ "$CRED_COUNT" -eq 0 ] 2>/dev/null; then
            echo "::error::Worker 未返回凭据：$(printf '%s' "$RESP" | jq -r '.error // "unknown"')"
            exit 1
          fi
          echo "拿到 ${CRED_COUNT} 组凭据，逐个直连 aistudio 复查状态..."

          echo "=== 2. GitHub 直连 aistudio 复查各实例状态 ==="
          ANY_AVAILABLE=0
          for i in $(seq 0 $((CRED_COUNT - 1))); do
            UID_I="$(printf '%s' "$RESP" | jq -r ".credentials[$i].userId // empty")"
            STOKEN_I="$(printf '%s' "$RESP" | jq -r ".credentials[$i].serviceToken // empty")"
            PH_I="$(printf '%s' "$RESP" | jq -r ".credentials[$i].xiaomichatbot_ph // empty")"
            # 进入日志前先 mask 敏感值。
            echo "::add-mask::$STOKEN_I"
            echo "::add-mask::$PH_I"
            [ -z "$UID_I" ] || [ -z "$STOKEN_I" ] || [ -z "$PH_I" ] && continue
            ST="$(query_status "$UID_I" "$STOKEN_I" "$PH_I")"
            if [ "$ST" = "AVAILABLE" ]; then
              ANY_AVAILABLE=1
            fi
          done

          if [ "$ANY_AVAILABLE" -eq 1 ]; then
            echo "GitHub 复查发现有 AVAILABLE 实例（Worker 因 tunnel 残留/通道断而误判），无需 create。"
            exit 0
          fi

          echo "=== 3. 全部实例非 AVAILABLE，挑一个 create ==="
          # 复查阶段全不可用，挑第一组有效凭据创建。
          UID_C="$(printf '%s' "$RESP" | jq -r '.credentials[0].userId // empty')"
          STOKEN_C="$(printf '%s' "$RESP" | jq -r '.credentials[0].serviceToken // empty')"
          PH_C="$(printf '%s' "$RESP" | jq -r '.credentials[0].xiaomichatbot_ph // empty')"
          echo "::add-mask::$STOKEN_C"
          echo "::add-mask::$PH_C"
          if [ -z "$UID_C" ] || [ -z "$STOKEN_C" ] || [ -z "$PH_C" ]; then
            echo "::error::无可用凭据用于 create"
            exit 1
          fi
          echo "用 userId=${UID_C} 拉起实例"

          COOKIE_C="serviceToken=$(quote_val "$STOKEN_C"); userId=$(quote_val "$UID_C"); xiaomichatbot_ph=$(quote_val "$PH_C")"
          PH_ENC_C="$(jq -rn --arg v "$PH_C" '$v|@uri')"

          echo "--- 3a. 签署 agreement ---"
          curl -s -o /dev/null -w "agreement HTTP:%{http_code}\n" --max-time 20 \
            -X POST \
            -H "Accept: */*" \
            -H "Content-Type: application/json" \
            -H "Origin: ${AISTUDIO}" \
            -H "Referer: ${AISTUDIO}/" \
            -H "x-timezone: Asia/Shanghai" \
            -H "User-Agent: ${UA}" \
            -H "Cookie: ${COOKIE_C}" \
            "${AISTUDIO}/open-apis/agreement/user/mimo-claw?xiaomichatbot_ph=${PH_ENC_C}" || true

          echo "--- 3b. 创建 Claw 实例 ---"
          CREATE_BODY="$(curl -s -w "\nHTTP:%{http_code}" --max-time 30 \
            -X POST \
            -H "Accept: */*" \
            -H "Content-Type: application/json" \
            -H "Origin: ${AISTUDIO}" \
            -H "Referer: ${AISTUDIO}/" \
            -H "x-timezone: Asia/Shanghai" \
            -H "User-Agent: ${UA}" \
            -H "Cookie: ${COOKIE_C}" \
            "${AISTUDIO}/open-apis/user/mimo-claw/create?xiaomichatbot_ph=${PH_ENC_C}")"

          CREATE_CODE="$(printf '%s' "$CREATE_BODY" | sed -n 's/^HTTP://p' | tail -1)"
          CREATE_JSON="$(printf '%s' "$CREATE_BODY" | sed '$d')"
          echo "create HTTP:${CREATE_CODE}"
          # create 响应通常只有 code/message，不含凭据，可安全打印。
          echo "create resp: $(printf '%s' "$CREATE_JSON" | head -c 300)"

          if [ "$CREATE_CODE" = "200" ]; then
            echo "✅ 冷启动创建请求已提交，Worker Cron 将接管后续轮询。"
          elif [ "$CREATE_CODE" = "401" ]; then
            echo "::warning::凭据已失效（401），该账号需更新。"
            exit 1
          elif [ "$CREATE_CODE" = "429" ]; then
            echo "::warning::负载过高（429），稍后重试。"
          else
            echo "::warning::创建返回 HTTP ${CREATE_CODE}"
          fi
