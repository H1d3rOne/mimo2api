# 复制为 wrangler.toml 后再修改：
#   cp wrangler.example.toml wrangler.toml
# wrangler.toml 会被 .gitignore 忽略，适合写入自己的 Worker 域名、KV id 等本地配置。

name = "mimo2api"
main = "src/index.ts"
compatibility_date = "2026-06-10"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[[durable_objects.bindings]]
name = "GATEWAY"
class_name = "GatewayDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewayDurableObject"]

# 创建命令：wrangler kv namespace create MIMO_KV
# 把输出中的 id 填到这里。
[[kv_namespaces]]
binding = "MIMO_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# 可选：Cloudflare Zero Trust Gateway / Workers VPC 出站通道。
# 启用后，Worker 管理 MIMO AI Studio 时可通过 env.EGRESS.fetch() 出站；
# 配合 MIMO_CONTROL_CHANNEL="gateway" 时会强制替代 Tunnel 管理通道。
# 需要先在 Cloudflare Zero Trust / Gateway 中创建可用于 egress 的 VPC network。
# [[vpc_networks]]
# binding = "EGRESS"
# network_id = "cf1:network"
# remote = true
#
# 推荐：为 aistudio.xiaomimimo.com 创建专用 VPC Service 后绑定到 Worker。
# 若 EGRESS 访问 aistudio 返回 destination_ip_prohibited，可固定到当前 ALB 公网 IP，
# 由请求 URL 保持 Host/SNI，VPC Service 负责连接到该 IP。
# wrangler vpc service create mimo-aistudio \
#   --type http \
#   --tunnel-id YOUR_TUNNEL_ID \
#   --ipv4 39.101.90.223 \
#   --https-port 443 \
#   --cert-verification-mode disabled
# [[vpc_services]]
# binding = "MIMO_AISTUDIO"
# service_id = "YOUR_VPC_SERVICE_ID"
# remote = true

[triggers]
crons = ["*/2 * * * *"]

[vars]
# Worker 自身 /ws 地址。部署到自定义域名后改成：wss://你的域名/ws
MIMO2API_WS_URL = "wss://your-worker-domain.example.com/ws"

# 可选：强制管理通道。启用 Gateway EGRESS 时建议打开；
# 这样即使 Cloudflare secret 里残留旧 MIMO_PROXY_URL，也不会继续走 Tunnel。
# MIMO_CONTROL_CHANNEL = "gateway"
# USE_VPC_EGRESS = "true"

# 可选：Cloudflare 优选连接地址（Xray 风格 address）；也可在 WebUI 顶部“优选连接”里配置。
# Worker Host/SNI 仍使用 MIMO2API_WS_URL 的域名。
# 例如：实际 TCP 连接 cf-best.example.com，但 Host/SNI 仍为 your-worker-domain.example.com。
# MIMO2API_PREFERRED_BASE_URL = "https://cf-best.example.com"
# MIMO2API_PREFERRED_WS_URL = "wss://cf-best.example.com/ws"

# 可选：默认是否开启 /v1/responses -> /v1/chat/completions 端点转换；也可在 WebUI 顶部“端点转换”里配置。
MIMO_ENDPOINT_CONVERSION_ENABLED = "false"

# 可选：模型映射 JSON。WebUI 修改后的映射会优先持久化到 KV。
# MODEL_MAPPING_JSON = '{"gpt-5.4-mini":"mimo-v2-flash"}'

# 敏感信息请使用 wrangler secret，不要写在 wrangler.toml：
#   wrangler secret put MIMO_RELAY_OPENAI_KEY
#   wrangler secret put MIMO_WEBUI_USERNAME
#   wrangler secret put MIMO_WEBUI_PASSWORD
#   wrangler secret put MIMO_PROXY_URL      # Tunnel/反代管理通道；Gateway EGRESS 模式通常不需要
#   wrangler secret put MIMO_TUNNEL_TOKEN   # 仅 Tunnel 模式需要
